<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineReserve 实验数据管理与导出平台</title>
    <!-- SheetJS 与 Font Awesome -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (online-study-4) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- 引入 80 间正交基底独立餐厅数据集 -->
    <script src="restaurants_data.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5OysrS98cHA7WXbObSGtUvfazPJStkRE",
            authDomain: "online-study-4.firebaseapp.com",
            databaseURL: "https://online-study-4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "online-study-4",
            storageBucket: "online-study-4.firebasestorage.app",
            messagingSenderId: "597103940431",
            appId: "1:597103940431:web:d854df1b51a7f76f2aeb3a"
        };
        try {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.database();
        } catch(e) {
            console.error("Firebase 初始化失败:", e);
        }
    </script>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; }
        body {
            background-color: var(--bg);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .main-card {
            background: var(--card-bg);
            max-width: 720px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06), 0 8px 10px -6px rgba(0,0,0,0.01);
            border: 1px solid var(--border);
            padding: 36px 32px;
        }
        .header-section {
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .header-section h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-section p {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 6px;
            line-height: 1.5;
        }
        .stat-banner {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 24px;
            text-align: center;
        }
        .stat-item h4 {
            font-size: 0.78rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
        }
        .stat-item .val {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 2px;
        }
        .action-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-export {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .btn-export:hover { background: #1d4ed8; }
        .btn-export:disabled { background: #94a3b8; cursor: not-allowed; }

        .admin-danger-zone {
            border: 1.5px dashed #fca5a5;
            background: #fffaf0;
            border-radius: 12px;
            padding: 18px 20px;
            margin-top: 10px;
        }
        .danger-title {
            font-size: 0.92rem;
            font-weight: 800;
            color: #991b1b;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .danger-desc {
            font-size: 0.82rem;
            color: #7f1d1d;
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover { background: var(--danger-hover); }

        #statusMsg {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px 14px;
            border-radius: 8px;
            display: none;
            margin-top: 16px;
            line-height: 1.4;
        }
        .status-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .status-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .status-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header-section">
        <h1><i class="fa-solid fa-chart-pie" style="color:var(--accent);"></i> 实验数据统一导出与管理后台</h1>
    </div>

    <!-- 实时指标卡 -->
    <div class="stat-banner">
        <div class="stat-item">
            <h4>当前 Grouping 计数</h4>
            <div class="val" id="statGrouping">--</div>
        </div>
        <div class="stat-item">
            <h4>问卷提交样本数</h4>
            <div class="val" id="statSurveys">--</div>
        </div>
        <div class="stat-item">
            <h4>完成预订样本数</h4>
            <div class="val" id="statBookings">--</div>
        </div>
    </div>

    <div class="action-box">
        <button id="exportBtn" class="btn btn-export" onclick="exportMasterData()">
            <i class="fa-solid fa-file-excel"></i> 下载完整研究数据 Excel
        </button>
    </div>

    <!-- 管理员高危清空区域 (短语验证保护) -->
    <div class="admin-danger-zone">
        <div class="danger-title">
            <i class="fa-solid fa-triangle-exclamation"></i> 实验重置与数据清空
        </div>
        <div class="danger-desc">
            此操作将彻底抹除数据库中的用户、问卷答卷、预订记录，<strong>并将 <code>grouping</code> 变量彻底归零重置为 0</strong>。操作前需输入安全校验短语。
        </div>
        <button id="resetBtn" class="btn btn-danger" onclick="handleSecureReset()">
            <i class="fa-solid fa-trash-can"></i> 重置清空数据库
        </button>
    </div>

    <div id="statusMsg"></div>
</div>

<script>
    // 指定的安全重置验证短语
    const REQUIRED_CONFIRM_PHRASE = "DELETE-DATABASE";

    function getRestDetailsById(id) {
        if (typeof restaurantsData !== 'undefined' && Array.isArray(restaurantsData)) {
            const found = restaurantsData.find(r => r.id === parseInt(id, 10));
            if (found) {
                return {
                    name: found.name,
                    region: found.region,
                    cuisine: found.cuisine,
                    hasEco: found.hasSustainable ? "Yes" : "No",
                    ecoAward: found.ecoAward || "None"
                };
            }
        }
        return { name: `餐厅ID #${id}`, region: "", cuisine: "", hasEco: "Unknown", ecoAward: "" };
    }

    async function loadStats() {
        if (typeof db === 'undefined') return;
        try {
            const [groupSnap, surveySnap, bookSnap] = await Promise.all([
                db.ref('grouping').once('value'),
                db.ref('survey_responses').once('value'),
                db.ref('restaurant_bookings').once('value')
            ]);
            document.getElementById("statGrouping").innerText = groupSnap.val() !== null ? groupSnap.val() : 0;
            document.getElementById("statSurveys").innerText = surveySnap.val() ? Object.keys(surveySnap.val()).length : 0;
            document.getElementById("statBookings").innerText = bookSnap.val() ? Object.keys(bookSnap.val()).length : 0;
        } catch(e) {
            console.warn("读取统计信息失败:", e);
        }
    }

    function showStatus(text, type = "info") {
        const el = document.getElementById("statusMsg");
        el.className = `status-${type}`;
        el.innerHTML = text;
        el.style.display = "block";
    }

    // ==========================================
    // 导出数据：Sheet 1 (Master Data) + Sheet 2 (Condition Summary)
    // ==========================================
    async function exportMasterData() {
        const btn = document.getElementById("exportBtn");
        btn.disabled = true;
        showStatus("<i class='fa-solid fa-spinner fa-spin'></i> 正在读取 Firebase 数据库并进行实验分组统计...", "info");

        try {
            const [groupSnap, usersSnap, surveySnap, bookingsSnap] = await Promise.all([
                db.ref('grouping').once('value'),
                db.ref('users').once('value'),
                db.ref('survey_responses').once('value'),
                db.ref('restaurant_bookings').once('value')
            ]);

            const currentGroupingCounter = groupSnap.val() !== null ? groupSnap.val() : 0;
            const users = usersSnap.val() ? Object.values(usersSnap.val()) : [];
            const surveys = surveySnap.val() ? Object.values(surveySnap.val()) : [];
            const bookings = bookingsSnap.val() ? Object.values(bookingsSnap.val()) : [];

            // 搜集所有不重复的 32 位 Participant ID
            const allPIDs = new Set([
                ...users.map(u => u.participantID),
                ...surveys.map(s => s.participantID),
                ...bookings.map(b => b.participantID)
            ].filter(pid => pid && pid.trim() !== ""));

            const masterDataMap = {};

            // 定义 Sheet 1: Master_Research_Data 每行结构
            allPIDs.forEach(pid => {
                masterDataMap[pid] = {
                    "Participant_ID": pid,
                    "Assigned_Group": "",
                    "Group_Condition_Label": "",
                    "Use_Real_AI": "",
                    "Show_AI_Label": "",
                    "Group_Counter_At_Entry": "",

                    // 问卷偏好作答 (最新 4 题)
                    "Survey_Submitted_Time": "",
                    "Q1_Budget_Tier": "",
                    "Q2_Preferred_Region": "",
                    "Q3_Preferred_Cuisine": "",
                    "Q4_Selected_Facilities": "",

                    // 推荐系统决策与 Nudge Text 记录
                    "Recommended_Rest_ID": "",
                    "Recommended_Rest_Name": "",
                    "Recommendation_Nudge_Text": "",

                    // 最终餐厅预订行为
                    "Has_Completed_Booking": "No",
                    "Booking_Confirmed_Time": "",
                    "Selected_Rest_ID": "",
                    "Selected_Rest_Name": "",
                    "Selected_Rest_Region": "",
                    "Selected_Rest_Cuisine": "",
                    "Booking_Total_Amount": "",
                    "Is_Recommendation_Adopted": "No"
                };
            });

            // 填充问卷数据、推荐决策与 Nudge Text
            surveys.forEach(s => {
                const pid = s.participantID;
                if (masterDataMap[pid]) {
                    const row = masterDataMap[pid];
                    row["Survey_Submitted_Time"] = s.submittedAt || "";
                    row["Group_Counter_At_Entry"] = s.groupCounter !== undefined ? s.groupCounter : "";

                    if (s.assignedGroup !== undefined) {
                        row["Assigned_Group"] = s.assignedGroup;
                        const groupConditions = [
                            "Group 0 (真实AI推荐 / 标示AI)",
                            "Group 1 (预设推荐 / 标示AI)",
                            "Group 2 (真实AI推荐 / 不标示AI)",
                            "Group 3 (预设推荐 / 不标示AI)"
                        ];
                        row["Group_Condition_Label"] = groupConditions[s.assignedGroup] || `Group ${s.assignedGroup}`;
                    }

                    row["Use_Real_AI"] = s.useRealAi ? "Yes" : "No";
                    row["Show_AI_Label"] = s.showAiLabel ? "Yes" : "No";

                    if (s.responses) {
                        row["Q1_Budget_Tier"] = s.responses.budget_tier || "";
                        row["Q2_Preferred_Region"] = s.responses.preferred_region || "";
                        row["Q3_Preferred_Cuisine"] = s.responses.preferred_cuisine || "";
                        row["Q4_Selected_Facilities"] = Array.isArray(s.responses.facility_highlights)
                            ? s.responses.facility_highlights.join("; ")
                            : (s.responses.facility_highlight || "");
                    }

                    const recId = s.aiRecommendedRestaurantId;
                    row["Recommended_Rest_ID"] = recId || "";
                    const recDetails = getRestDetailsById(recId);
                    row["Recommended_Rest_Name"] = recDetails.name;

                    // 兼容读取 nudge 推荐理由文字
                    row["Recommendation_Nudge_Text"] = s.nudgeContent || s.nudge_text || s.nudgeText || "";
                }
            });

            // 填充预订记录数据
            bookings.forEach(b => {
                const pid = b.participantID;
                if (masterDataMap[pid]) {
                    const row = masterDataMap[pid];
                    row["Has_Completed_Booking"] = "Yes";
                    row["Booking_Confirmed_Time"] = b.bookingTime || "";
                    row["Selected_Rest_ID"] = b.selectedRestaurantId || "";
                    row["Selected_Rest_Name"] = b.selectedRestaurantName || getRestDetailsById(b.selectedRestaurantId).name;
                    row["Selected_Rest_Region"] = b.selectedRestaurantRegion || "";
                    row["Selected_Rest_Cuisine"] = b.selectedRestaurantCuisine || "";
                    row["Booking_Total_Amount"] = b.totalAmount || "";
                    row["Is_Recommendation_Adopted"] = b.isAiRecommendedSelected ? "Yes" : "No";
                }
            });

            const rowsArray = Object.values(masterDataMap);

            // ==========================================
            // 构建 Sheet 2: Condition Summary 分组统计总表
            // ==========================================
            const conditionsConfig = [
                { groupIndex: 0, label: "Group 0: 真实AI推荐 + 标示AI", realAi: "Yes", showAi: "Yes" },
                { groupIndex: 1, label: "Group 1: 预设推荐 + 标示AI (欺骗)", realAi: "No", showAi: "Yes" },
                { groupIndex: 2, label: "Group 2: 真实AI推荐 + 不标示AI", realAi: "Yes", showAi: "No" },
                { groupIndex: 3, label: "Group 3: 预设推荐 + 不标示AI", realAi: "No", showAi: "No" }
            ];

            const summaryRows = conditionsConfig.map(cond => {
                const groupRows = rowsArray.filter(r => Number(r.Assigned_Group) === cond.groupIndex);
                const totalAssigned = groupRows.length;
                const surveyCompleted = groupRows.filter(r => r.Survey_Submitted_Time && r.Survey_Submitted_Time.trim() !== "").length;
                const bookingCompleted = groupRows.filter(r => r.Has_Completed_Booking === "Yes").length;
                const bookingRate = surveyCompleted > 0 ? ((bookingCompleted / surveyCompleted) * 100).toFixed(1) + "%" : "0.0%";

                const recAdoptedCount = groupRows.filter(r => r.Is_Recommendation_Adopted === "Yes").length;
                const adoptionRateOfBookers = bookingCompleted > 0 ? ((recAdoptedCount / bookingCompleted) * 100).toFixed(1) + "%" : "0.0%";
                const adoptionRateOfTotal = surveyCompleted > 0 ? ((recAdoptedCount / surveyCompleted) * 100).toFixed(1) + "%" : "0.0%";

                // 计算平均预订金额 (提取数值)
                const amounts = groupRows
                    .filter(r => r.Has_Completed_Booking === "Yes" && r.Booking_Total_Amount)
                    .map(r => {
                        const num = parseFloat(String(r.Booking_Total_Amount).replace(/[^0-9.]/g, ""));
                        return isNaN(num) ? 0 : num;
                    })
                    .filter(num => num > 0);

                const avgAmount = amounts.length > 0 ? (amounts.reduce((a, b) => a + b, 0) / amounts.length).toFixed(0) : "N/A";

                return {
                    "Condition": cond.label,
                    "Assigned_Group_Index": cond.groupIndex,
                    "Real_AI_Engine": cond.realAi,
                    "AI_Label_Framing": cond.showAi,
                    "Total_Participants": totalAssigned,
                    "Survey_Completed": surveyCompleted,
                    "Booking_Completed": bookingCompleted,
                    "Booking_Conversion_Rate": bookingRate,
                    "Adopted_Rec_Count": recAdoptedCount,
                    "Rec_Adoption_Rate_of_Bookers": adoptionRateOfBookers,
                    "Rec_Adoption_Rate_of_All_Surveys": adoptionRateOfTotal,
                    "Avg_Booking_Amount_HK$": avgAmount
                };
            });

            // 添加 Total 综合行
            const totalSurvey = rowsArray.filter(r => r.Survey_Submitted_Time && r.Survey_Submitted_Time.trim() !== "").length;
            const totalBook = rowsArray.filter(r => r.Has_Completed_Booking === "Yes").length;
            const totalAdopt = rowsArray.filter(r => r.Is_Recommendation_Adopted === "Yes").length;
            const allAmounts = rowsArray
                .filter(r => r.Has_Completed_Booking === "Yes" && r.Booking_Total_Amount)
                .map(r => {
                    const num = parseFloat(String(r.Booking_Total_Amount).replace(/[^0-9.]/g, ""));
                    return isNaN(num) ? 0 : num;
                })
                .filter(num => num > 0);
            const overallAvgAmount = allAmounts.length > 0 ? (allAmounts.reduce((a, b) => a + b, 0) / allAmounts.length).toFixed(0) : "N/A";

            summaryRows.push({
                "Condition": "Overall Total",
                "Assigned_Group_Index": "ALL",
                "Real_AI_Engine": "Mixed",
                "AI_Label_Framing": "Mixed",
                "Total_Participants": rowsArray.length,
                "Survey_Completed": totalSurvey,
                "Booking_Completed": totalBook,
                "Booking_Conversion_Rate": totalSurvey > 0 ? ((totalBook / totalSurvey) * 100).toFixed(1) + "%" : "0.0%",
                "Adopted_Rec_Count": totalAdopt,
                "Rec_Adoption_Rate_of_Bookers": totalBook > 0 ? ((totalAdopt / totalBook) * 100).toFixed(1) + "%" : "0.0%",
                "Rec_Adoption_Rate_of_All_Surveys": totalSurvey > 0 ? ((totalAdopt / totalSurvey) * 100).toFixed(1) + "%" : "0.0%",
                "Avg_Booking_Amount_HK$": overallAvgAmount
            });

            // 建立多 Sheet 工作簿
            const wb = XLSX.utils.book_new();

            // Sheet 1: Master_Research_Data (被试全维单行宽表，包含 Nudge Text)
            const wsMaster = XLSX.utils.json_to_sheet(rowsArray);
            XLSX.utils.book_append_sheet(wb, wsMaster, "Master_Research_Data");

            // Sheet 2: Condition Summary (实验组别统计)
            const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
            XLSX.utils.book_append_sheet(wb, wsSummary, "Condition Summary");

            // 自动调整列宽
            const wscolsSummary = [
                {wch: 32}, {wch: 20}, {wch: 16}, {wch: 16},
                {wch: 18}, {wch: 18}, {wch: 18}, {wch: 24},
                {wch: 18}, {wch: 28}, {wch: 32}, {wch: 24}
            ];
            wsSummary['!cols'] = wscolsSummary;

            const timestamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
            XLSX.writeFile(wb, `DineReserve_Research_Data_${timestamp}.xlsx`);

            showStatus(`✅ 导出成功！已包含 <strong>Recommendation_Nudge_Text</strong> 栏位，并生成 <strong>Master_Research_Data</strong> (${rowsArray.length} 行) 与 <strong>Condition Summary</strong> 统计总表。当前 Grouping 累计值为: <strong>${currentGroupingCounter}</strong>`, "success");
        } catch(err) {
            console.error(err);
            showStatus(`❌ 导出失败: ${err.message}`, "error");
        } finally {
            btn.disabled = false;
            loadStats();
        }
    }

    // ==========================================
    // 2. 短语验证重置逻辑 (清空数据并归零 Grouping)
    // ==========================================
    async function handleSecureReset() {
        const promptMsg = `⚠️【高危操作警告】\n\n此操作将抹除所有作答、预订记录并将 grouping 重置为 0！\n\n如确认重置，请在下方文本框中精确输入提示短语：\n${REQUIRED_CONFIRM_PHRASE}`;
        const userInput = prompt(promptMsg);

        if (userInput === null) {
            return;
        }

        if (userInput.trim() !== REQUIRED_CONFIRM_PHRASE) {
            alert(`输入错误！您输入的短语不匹配，操作已安全取消。\n要求短语为: ${REQUIRED_CONFIRM_PHRASE}`);
            return;
        }

        const resetBtn = document.getElementById("resetBtn");
        resetBtn.disabled = true;
        showStatus("<i class='fa-solid fa-spinner fa-spin'></i> 验证通过，正在清空节点并将 grouping 计数重置为 0...", "info");

        try {
            await Promise.all([
                db.ref('users').remove(),
                db.ref('survey_responses').remove(),
                db.ref('restaurant_bookings').remove(),
                db.ref('visit_logs').remove(),
                db.ref('grouping').set(0)
            ]);

            showStatus("🎉 数据库重置完毕！所有被试数据已清空，<code>grouping</code> 变量已重置归零为 <strong>0</strong>。", "success");
            alert("重置完成！grouping 计数器已归零为 0。");
        } catch(err) {
            console.error("Reset Failed:", err);
            showStatus(`❌ 重置失败: ${err.message}`, "error");
        } finally {
            resetBtn.disabled = false;
            loadStats();
        }
    }

    window.addEventListener("DOMContentLoaded", loadStats);
</script>
</body>
</html>
