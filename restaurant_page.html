    .floating-recommend-popup.active { display: block; }
  </style>
</head>

<script>
  let currentList = [...restaurantsData];
  let selectedRest = null;
  let selectedMenu = null;
  const RECOMMENDED_ID = 42;

  function renderRestaurantList(data) {
    const container = document.getElementById("restaurantListContainer");
    document.getElementById("restaurantCount").innerText = `${data.length} 间香港精选餐厅`;

    const sorted = [...data].sort((a, b) => a.id === RECOMMENDED_ID ? -1 : b.id === RECOMMENDED_ID ? 1 : 0);

    container.innerHTML = sorted.map(rest => {
      const isTop = (rest.id === RECOMMENDED_ID);
      return `
        <div class="restaurant-card ${isTop ? 'featured' : ''}">
          ${isTop ? `<div class="top-recommend-banner"><span><i class="fa-solid fa-crown"></i> 平台今日独家主推 • 极佳景观</span><span><i class="fa-solid fa-fire"></i> 必吃榜推荐</span></div>` : ''}
          <div class="rest-image-col" style="position:relative;">
            <img src="${rest.images[0]}" alt="${rest.name}">
            ${isTop ? `<div style="position:absolute;top:10px;left:10px;background:#dc2626;color:white;font-size:0.7rem;padding:2px 6px;border-radius:4px;font-weight:bold;">⭐ 主推餐厅</div>` : ''}
          </div>
          <div class="rest-info-col">
            <div>
              <div style="color:var(--star);font-size:0.8rem;margin-bottom:4px;">${'⭐'.repeat(rest.stars)} <span style="color:#64748b;font-weight:600;">${rest.district}</span></div>
              <h2 class="rest-title">${rest.name}</h2>
              <div class="rest-location"><i class="fa-solid fa-location-dot"></i> ${rest.location}</div>
            </div>
            <div style="margin: 10px 0;">
              ${isTop ? '<span class="badge-pill gold"><i class="fa-solid fa-crown"></i> 官方主推</span>' : ''}
              ${rest.hasPrivateRoom ? '<span class="badge-pill"><i class="fa-solid fa-door-closed"></i> 独立包厢</span>' : ''}
              ${rest.hasWindowSeat ? '<span class="badge-pill"><i class="fa-solid fa-city"></i> 景观位</span>' : ''}
              ${rest.hasParking ? '<span class="badge-pill"><i class="fa-solid fa-car"></i> 免费停车</span>' : ''}
            </div>
          </div>
          <div class="rest-pricing-col">
            <div style="display:flex; justify-content:flex-end; gap:0.6rem; align-items:center;">
              <div style="text-align:right;">
                <div style="font-weight:700; color:var(--primary);">${rest.verdict}</div>
                <div style="font-size:0.72rem; color:#94a3b8;">${rest.reviewCount} 条食客评价</div>
              </div>
              <div class="score-badge">${rest.rating}</div>
            </div>
            <div style="margin-top:auto;">
              <div style="text-decoration:line-through; font-size:0.8rem; color:#94a3b8;">HK$ ${rest.originalPrice}</div>
              <div><span style="font-weight:700; color:var(--accent);">HK$ </span><span class="main-price">${rest.price}</span><span style="font-size:0.8rem;color:#64748b;"> /人均起</span></div>
            </div>
            <button class="btn-select ${isTop ? 'gold-btn' : ''}" onclick="openMenuModal(${rest.id})">查看菜单及预订</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function openMenuModal(id) {
    selectedRest = restaurantsData.find(r => r.id === id);
    document.getElementById("modalRestTitle").innerText = selectedRest.name;
    document.getElementById("modalRestSubtitle").innerText = selectedRest.location;

    document.getElementById("modalMenuList").innerHTML = selectedRest.menus.map(menu => `
      <div style="border:1px solid #e2e8f0; border-radius:8px; display:flex; overflow:hidden;">
        <img src="${menu.image}" style="width:200px; object-fit:cover;">
        <div style="padding:1rem; flex:1; display:flex; flex-direction:column; justify-content:space-between;">
          <div>
            <h4 style="font-size:1.1rem; font-weight:700;">${menu.name}</h4>
            <div style="font-size:0.82rem; color:#64748b; margin-top:8px; display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
              <span><i class="fa-solid fa-utensils"></i> 菜系：${menu.style}</span>
              <span><i class="fa-solid fa-wine-glass"></i> 酒水：${menu.drinks}</span>
              <span><i class="fa-solid fa-chair"></i> 座位：${menu.seating}</span>
              <span style="color:var(--success);"><i class="fa-solid fa-circle-check"></i> ${menu.cancel}</span>
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:1rem;">
            <div><span style="font-size:1.25rem; font-weight:800; color:var(--accent);">HK$ ${menu.price}</span><span style="font-size:0.75rem; color:#94a3b8;"> /每位</span></div>
            <button class="btn-search" style="padding:0.5rem 1rem; font-size:0.9rem;" onclick="openCheckoutModal('${menu.id}')">锁定此套餐</button>
          </div>
        </div>
      </div>
    `).join('');
    document.getElementById("menuModal").classList.add("active");
  }

  function closeMenuModal() { document.getElementById("menuModal").classList.remove("active"); }

  function openCheckoutModal(menuId) {
    selectedMenu = selectedRest.menus.find(m => m.id === menuId);
    closeMenuModal();
    document.getElementById("checkoutRestName").innerText = selectedRest.name;
    document.getElementById("checkoutMenuName").innerText = selectedMenu.name;

    const baseTotal = selectedMenu.price * 2; // 默认2人
    const tax = Math.round(baseTotal * 0.1);

    document.getElementById("checkoutBasePrice").innerText = `HK$ ${baseTotal}`;
    document.getElementById("checkoutTaxPrice").innerText = `HK$ ${tax}`;
    document.getElementById("checkoutTotalPrice").innerText = `HK$ ${baseTotal + tax}`;

    document.getElementById("checkoutModal").classList.add("active");
  }

  function closeCheckoutModal() { document.getElementById("checkoutModal").classList.remove("active"); }

  function confirmBooking() {
    alert(`预订成功！您已成功锁定 ${selectedRest.name} 的座位。电子凭证已发送至您的手机。`);
    closeCheckoutModal();
  }

  function updatePriceFilter(val) {
    document.getElementById("priceRangeLabel").innerText = `最高 HK$ ${val}`;
    filterRestaurants();
  }

  function filterRestaurants() {
    const max = parseInt(document.getElementById("priceRange").value);
    const pRoom = document.getElementById("filterPrivateRoom").checked;
    const wSeat = document.getElementById("filterWindowSeat").checked;
    const pKing = document.getElementById("filterParking").checked;
    const vegan = document.getElementById("filterVegan").checked;

    currentList = restaurantsData.filter(r => {
      if (r.price > max) return false;
      if (pRoom && !r.hasPrivateRoom) return false;
      if (wSeat && !r.hasWindowSeat) return false;
      if (pKing && !r.hasParking) return false;
      if (vegan && !r.hasVegan) return false;
      return true;
    });
    renderRestaurantList(currentList);
  }

  function resetFilters() {
    document.getElementById("priceRange").value = 5000;
    document.getElementById("priceRangeLabel").innerText = "最高 HK$ 5,000";
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
    filterRestaurants();
  }

  function sortData(type, btn) {
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    if (type === 'priceAsc') currentList.sort((a,b) => a.price - b.price);
    else if (type === 'rating') currentList.sort((a,b) => b.rating - a.rating);
    else currentList.sort((a,b) => a.id - b.id);
    renderRestaurantList(currentList);
  }

  window.onload = () => renderRestaurantList(restaurantsData);
</script>
</body>
</html>
