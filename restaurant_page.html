  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #e11d48;
      --primary-dark: #be123c;
      --primary-light: #fff1f2;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --star: #f59e0b;
      --success: #10b981;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .navbar { max-width: 1280px; margin: 0 auto; padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); text-decoration: none; }
    .logo span { color: var(--text-main); }
    .hero-search-wrapper { background: linear-gradient(135deg, #be123c 0%, #e11d48 60%, #f43f5e 100%); padding: 2.2rem 1.5rem 3rem 1.5rem; color: white; }
    .search-container { max-width: 1200px; margin: 0 auto; }
    .hero-title { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.4rem; }
    .hero-subtitle { font-size: 0.95rem; opacity: 0.9; margin-bottom: 1.5rem; }
    .search-box { background: white; padding: 0.75rem; border-radius: var(--radius-lg); box-shadow: 0 12px 28px rgba(0,0,0,0.18); display: grid; grid-template-columns: 2fr 1.6fr 1.6fr 1fr; gap: 0.6rem; align-items: center; }
    .search-field { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.9rem; border: 1.5px solid var(--border); border-radius: var(--radius-md); background: #fff; }
    .search-field i { color: var(--primary); font-size: 1.15rem; min-width: 20px; }
    .search-field-content { display: flex; flex-direction: column; flex: 1; }
    .search-label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); }
    .search-input { border: none; outline: none; font-size: 0.92rem; font-weight: 600; color: var(--text-main); width: 100%; }
    .btn-search { background: var(--accent); color: white; border: none; font-size: 1.05rem; font-weight: 700; padding: 0.95rem 1.5rem; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; height: 100%; }
    .main-layout { max-width: 1280px; margin: -1.5rem auto 3rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 280px 1fr; gap: 1.75rem; width: 100%; }
    .filters-sidebar { background: var(--surface); border-radius: var(--radius-lg); padding: 1.25rem; border: 1px solid var(--border); position: sticky; top: 5rem; height: fit-content; }
    .filter-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .filter-group { margin-bottom: 1.25rem; padding-bottom: 1.1rem; border-bottom: 1px solid #f1f5f9; }
    .filter-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 0.65rem; display: flex; justify-content: space-between; }
    .filter-checkbox { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; font-size: 0.85rem; cursor: pointer; }
    .filter-checkbox .count { margin-left: auto; color: var(--text-light); font-size: 0.75rem; }
    .price-range-slider { width: 100%; margin: 0.5rem 0; accent-color: var(--primary); }
    .results-section { display: flex; flex-direction: column; gap: 1rem; }
    .sort-bar { background: var(--surface); border-radius: var(--radius-md); padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); font-size: 0.88rem; }
    .sort-options { display: flex; gap: 0.5rem; }
    .sort-btn { border: 1px solid var(--border); background: white; padding: 0.4rem 0.8rem; border-radius: var(--radius-full); font-size: 0.82rem; cursor: pointer; font-weight: 600; }
    .sort-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .restaurant-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; display: grid; grid-template-columns: 300px 1fr 220px; position: relative; transition: all 0.2s; }
    .restaurant-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .restaurant-card.featured-recommendation { border: 2.5px solid #d97706; background: linear-gradient(180deg, #fffdfa 0%, #ffffff 100%); }
    .top-recommend-banner { grid-column: 1 / -1; background: linear-gradient(90deg, #b45309 0%, #d97706 50%, #f59e0b 100%); color: white; padding: 0.35rem 1rem; font-size: 0.82rem; font-weight: 700; display: flex; justify-content: space-between; }
    .rest-image-col { position: relative; background: #e2e8f0; min-height: 210px; }
    .rest-image-col img { width: 100%; height: 100%; object-fit: cover; }
    .tag-deal { position: absolute; top: 10px; left: 10px; background: #dc2626; color: white; font-size: 0.72rem; font-weight: 800; padding: 0.25rem 0.6rem; border-radius: 4px; }
    .rest-info-col { padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px dashed var(--border); }
    .badge-pill { font-size: 0.74rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600; background: #f1f5f9; color: #475569; display: inline-flex; align-items: center; gap: 0.3rem; margin-right: 4px; margin-bottom: 4px; }
    .badge-pill.gold-star { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; font-weight: 700; }
    .rest-pricing-col { padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; background: #fcfdfe; text-align: right; }
    .score-badge { background: var(--primary); color: white; font-weight: 800; font-size: 1.05rem; padding: 0.35rem 0.6rem; border-radius: 8px 8px 8px 0; display: inline-block; }
    .main-price { font-size: 1.55rem; font-weight: 800; color: var(--accent); }
    .btn-select-menu { background: var(--primary); color: white; border: none; padding: 0.7rem 1rem; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
    .btn-select-menu.gold-btn { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }

    /* 彈窗樣式 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 1.5rem; }
    .modal-overlay.active { display: flex; }
    .modal-container { background: white; border-radius: var(--radius-lg); width: 100%; max-width: 980px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 1.25rem 1.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #f8fafc; }
    .modal-body { padding: 1.5rem 1.75rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; }
    .btn-close-modal { background: none; border: none; font-size: 1.3rem; cursor: pointer; }

    .recommend-modal-card { background: #ffffff; border-radius: var(--radius-lg); max-width: 600px; width: 100%; overflow: hidden; border: 2px solid #f59e0b; }
    .recommend-modal-header { background: linear-gradient(135deg, #be123c 0%, #e11d48 50%, #d97706 100%); color: white; padding: 1.25rem 1.5rem; }
    .floating-recommend-popup { position: fixed; bottom: 24px; right: 24px; width: 400px; background: #ffffff; border-radius: var(--radius-lg); border: 2px solid #f59e0b; z-index: 90; display: none; }
    .floating-recommend-popup.active { display: block; }
  </style>
</head>
<body>

<header>
  <div class="navbar">
    <a href="#" class="logo"><i class="fa-solid fa-utensils"></i> DineReserve<span>.com</span></a>
    <div class="user-profile"><div class="user-avatar"><i class="fa-solid fa-user"></i></div><span id="displayPID">Participant</span></div>
  </div>
</header>

<div class="hero-search-wrapper">
  <div class="search-container">
    <h1 class="hero-title">探索中國香港頂級餐廳與米芝蓮尋味之旅</h1>
    <p class="hero-subtitle">智能分析您的就餐偏好，尊享會員專屬景觀席與限定品鑑菜單</p>
    <div class="search-box">
      <div class="search-field"><i class="fa-solid fa-location-dot"></i><div class="search-field-content"><span class="search-label">商圈 / 餐廳名稱</span><input type="text" class="search-input" value="中國香港 (Hong Kong)"></div></div>
      <div class="search-field"><i class="fa-regular fa-clock"></i><div class="search-field-content"><span class="search-label">就餐時間</span><input type="text" class="search-input" value="2027年8月20日 19:30 (晚市)"></div></div>
      <div class="search-field"><i class="fa-solid fa-user-group"></i><div class="search-field-content"><span class="search-label">人數</span><input type="text" class="search-input" value="2 位成人"></div></div>
      <button class="btn-search" onclick="filterRestaurants()"><i class="fa-solid fa-magnifying-glass"></i> 搜尋餐廳</button>
    </div>
  </div>
</div>

<main class="main-layout">
  <aside class="filters-sidebar">
    <div class="filter-header"><h3><i class="fa-solid fa-sliders"></i> 條件篩選</h3><button onclick="resetFilters()" style="border:none;background:none;color:var(--primary);cursor:pointer;font-weight:600;">重置所有</button></div>
    <div class="filter-group">
      <div class="filter-title"><span>人均預算上限</span><span id="priceRangeLabel">最高 HK$ 5,000</span></div>
      <input type="range" id="priceRange" class="price-range-slider" min="1000" max="5000" step="100" value="5000" oninput="updatePriceFilter(this.value)">
    </div>
    <div class="filter-group">
      <div class="filter-title">餐廳星級</div>
      <label class="filter-checkbox"><input type="checkbox" name="star" value="5" onchange="filterRestaurants()"><span>⭐⭐⭐⭐⭐ 米芝蓮三星</span><span class="count" id="count-star-5"></span></label>
      <label class="filter-checkbox"><input type="checkbox" name="star" value="4" onchange="filterRestaurants()"><span>⭐⭐⭐⭐ 米芝蓮二星</span><span class="count" id="count-star-4"></span></label>
      <label class="filter-checkbox"><input type="checkbox" name="star" value="3" onchange="filterRestaurants()"><span>⭐⭐⭐ 米芝蓮一星/精選</span><span class="count" id="count-star-3"></span></label>
    </div>
    <div class="filter-group">
      <div class="filter-title">特色設施</div>
      <label class="filter-checkbox"><input type="checkbox" id="filterPrivateRoom" onchange="filterRestaurants()"><span>私密獨立包廂</span><span class="count" id="count-privateRoom"></span></label>
      <label class="filter-checkbox"><input type="checkbox" id="filterWindowSeat" onchange="filterRestaurants()"><span>靠窗景觀 / 夜景席</span><span class="count" id="count-windowSeat"></span></label>
      <label class="filter-checkbox"><input type="checkbox" id="filterParking" onchange="filterRestaurants()"><span>代客泊車服務</span><span class="count" id="count-parking"></span></label>
    </div>
  </aside>

  <section class="results-section">
    <div class="sort-bar">
      <div>搜尋結果：<span style="font-weight:700;" id="restaurantCount">0 間精選餐廳</span></div>
      <div class="sort-options">
        <button class="sort-btn active" onclick="sortRestaurants('popular', this)">今期推薦</button>
        <button class="sort-btn" onclick="sortRestaurants('priceAsc', this)">人均：低至高</button>
        <button class="sort-btn" onclick="sortRestaurants('rating', this)">評分最高</button>
      </div>
    </div>
    <div id="restaurantListContainer" style="display: flex; flex-direction: column; gap: 1.25rem;"></div>
  </section>
</main>

<!-- 進入頁面時的 AI 特別推薦彈窗 -->
<div class="modal-overlay" id="entryRecommendModal">
  <div class="recommend-modal-card">
    <div class="recommend-modal-header">
      <div style="background:#f59e0b;color:#78350f;font-size:0.75rem;font-weight:800;padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:6px;"><i class="fa-solid fa-wand-magic-sparkles"></i> 誠意推薦</div>
      <h2 style="font-size:1.3rem; font-weight:800;" id="modalAiRecTitle">Caprice (香港四季酒店)</h2>
      <p style="font-size:0.85rem; opacity:0.95; margin-top:4px;" id="modalAiRecNudgeText">為您量身定制的專屬推薦</p>
    </div>
    <div style="padding:1.5rem; display:flex; flex-direction:column; gap:1rem;">
      <div style="display:grid; grid-template-columns: 180px 1fr; gap:1rem; border-radius:8px; overflow:hidden; background:#f8fafc; border:1px solid var(--border);">
        <img id="modalAiRecImg" src="" style="width:100%; height:140px; object-fit:cover;">
        <div style="padding:0.75rem; display:flex; flex-direction:column; justify-content:space-between;">
          <div>
            <h4 style="font-weight:800;" id="modalAiRecName"></h4>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:2px;" id="modalAiRecLoc"></p>
          </div>
          <div><span style="font-size:1.25rem; font-weight:800; color:var(--accent);" id="modalAiRecPrice"></span><span style="font-size:0.75rem; color:var(--text-muted);"> /位起</span></div>
        </div>
      </div>
      <button class="btn-search" style="width:100%;" onclick="acceptRecommendation()"><i class="fa-solid fa-bell-concierge"></i> 查看推薦專屬套餐</button>
      <button onclick="dismissRecommendation()" style="background:transparent;border:1px solid #cbd5e1;padding:0.6rem;border-radius:8px;cursor:pointer;color:var(--text-muted);">瀏覽全部餐廳清單</button>
    </div>
  </div>
</div>

<!-- 彈窗 1：菜單選擇 -->
<div class="modal-overlay" id="menuModal">
  <div class="modal-container">
    <div class="modal-header">
      <div><h2 class="modal-header-title" id="modalRestTitle"></h2><p style="font-size:0.8rem;color:var(--text-muted);" id="modalRestSubtitle"></p></div>
      <button class="btn-close-modal" onclick="closeMenuModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body"><div id="modalMenuList" style="display:flex;flex-direction:column;gap:1rem;"></div></div>
  </div>
</div>

<!-- 彈窗 2：結賬確認 -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal-container" style="max-width: 800px;">
    <div class="modal-header"><h2 class="modal-header-title"><i class="fa-solid fa-shield-halved" style="color:var(--primary);"></i> 鎖定餐位與預訂確認</h2><button class="btn-close-modal" onclick="closeCheckoutModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div style="display:grid; grid-template-columns: 1.4fr 1fr; gap:1.5rem;">
        <div>
          <h4 style="margin-bottom:0.8rem;">預訂人信息</h4>
          <input type="text" id="guestName" value="Alex Wong" style="width:100%;padding:0.65rem;border:1px solid #cbd5e1;border-radius:6px;margin-bottom:0.8rem;">
          <input type="email" id="guestEmail" value="alex.wong@example.com" style="width:100%;padding:0.65rem;border:1px solid #cbd5e1;border-radius:6px;margin-bottom:0.8rem;">
          <input type="tel" id="guestPhone" value="+852 9123 4567" style="width:100%;padding:0.65rem;border:1px solid #cbd5e1;border-radius:6px;">
        </div>
        <div style="background:#f8fafc;padding:1.25rem;border-radius:10px;border:1px solid var(--border);">
          <h4 id="checkoutRestName"></h4>
          <p id="checkoutMenuName" style="font-size:0.85rem;color:var(--text-muted);margin:6px 0;"></p>
          <div style="display:flex;justify-content:space-between;margin-top:1rem;font-weight:800;font-size:1.15rem;"><span>實付總額</span><span style="color:var(--accent);" id="checkoutTotalPrice"></span></div>
          <button class="btn-search" style="width:100%;margin-top:1rem;" onclick="confirmBooking()">確認並鎖定餐位</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 右下角懸浮推薦 -->
<div class="floating-recommend-popup" id="floatingRecommendPopup">
  <div style="background:linear-gradient(90deg, #b45309, #d97706);color:white;padding:0.5rem 0.8rem;display:flex;justify-content:space-between;font-size:0.85rem;font-weight:700;">
    <span><i class="fa-solid fa-wand-magic-sparkles"></i> 推薦</span>
    <button onclick="closeFloatingPopup()" style="background:none;border:none;color:white;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div style="padding:0.85rem;background:#fffdfa;">
    <div style="display:flex;gap:0.75rem;align-items:center;">
      <img id="floatingThumb" src="" style="width:75px;height:75px;border-radius:6px;object-fit:cover;">
      <div><h4 style="font-size:0.9rem;" id="floatingTitle"></h4><span style="font-size:0.85rem;font-weight:800;color:var(--accent);" id="floatingPrice"></span></div>
    </div>
    <button class="btn-search" style="width:100%;margin-top:8px;padding:0.5rem;font-size:0.85rem;" onclick="acceptRecommendation()">立即預訂推薦套餐</button>
  </div>
</div>

<script>
  let currentPID = localStorage.getItem("participantID") || "Anonymous";
  document.getElementById("displayPID").innerText = currentPID;

  // 讀取問卷傳遞的 AI 推薦 ID，預設為 42
  let AI_RECOMMENDED_ID = parseInt(localStorage.getItem("ai_recommended_restaurant_id"), 10) || 42;
  let AI_NUDGE_TEXT = localStorage.getItem("ai_nudge_text") || "為您精心甄選的專屬星級主推餐廳。";

  let currentRestaurants = typeof restaurantsData !== 'undefined' ? [...restaurantsData] : [];
  let selectedRest = null;
  let selectedMenu = null;

  function updateFilterCounts() {
    let s5 = 0, s4 = 0, s3 = 0, pR = 0, wS = 0, pk = 0;
    restaurantsData.forEach(r => {
      if (r.stars === 5) s5++; else if (r.stars === 4) s4++; else if (r.stars === 3) s3++;
      if (r.hasPrivateRoom) pR++; if (r.hasWindowSeat) wS++; if (r.hasParking) pk++;
    });
    document.getElementById("count-star-5").innerText = `(${s5})`;
    document.getElementById("count-star-4").innerText = `(${s4})`;
    document.getElementById("count-star-3").innerText = `(${s3})`;
    document.getElementById("count-privateRoom").innerText = `(${pR})`;
    document.getElementById("count-windowSeat").innerText = `(${wS})`;
    document.getElementById("count-parking").innerText = `(${pk})`;
  }

  function renderRestaurantList(data) {
    const container = document.getElementById("restaurantListContainer");
    document.getElementById("restaurantCount").innerText = `${data.length} 間香港精選餐廳`;

    // AI 推薦餐廳一律強制排序在第 1 位
    const sorted = [...data].sort((a, b) => (a.id === AI_RECOMMENDED_ID ? -1 : b.id === AI_RECOMMENDED_ID ? 1 : 0));

    container.innerHTML = sorted.map(rest => {
      const isAI = (rest.id === AI_RECOMMENDED_ID);
      return `
        <div class="restaurant-card ${isAI ? 'featured-recommendation' : ''}">
          ${isAI ? `<div class="top-recommend-banner"><span><i class="fa-solid fa-wand-magic-sparkles"></i> AI 為您量身推薦 • 專屬席位特選</span><span>98% 食客高分推薦</span></div>` : ''}
          <div class="rest-image-col">
            <img src="${rest.images[0]}" alt="${rest.name}">
            ${isAI ? `<div class="tag-deal" style="background:#d97706;">⭐ AI 推薦首選</div>` : ''}
          </div>
          <div class="rest-info-col">
            <div>
              <div style="color:var(--star);font-size:0.75rem;">${'⭐'.repeat(rest.stars)} <span style="color:#64748b;">${rest.district}</span></div>
              <h2 style="font-size:1.15rem;font-weight:800;margin-top:2px;">${rest.name}</h2>
              <p style="font-size:0.8rem;color:var(--text-muted);"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${rest.location}</p>
            </div>
            <div>
              ${isAI ? `<span class="badge-pill gold-star"><i class="fa-solid fa-crown"></i> AI 優先推薦</span>` : ''}
              ${rest.hasPrivateRoom ? `<span class="badge-pill"><i class="fa-solid fa-door-closed"></i> 獨立包廂</span>` : ''}
              ${rest.hasWindowSeat ? `<span class="badge-pill"><i class="fa-solid fa-city"></i> 景觀席</span>` : ''}
            </div>
          </div>
          <div class="rest-pricing-col">
            <div><span style="font-size:0.75rem;color:var(--text-muted);">${rest.reviewCount} 則評價</span> <span class="score-badge">${rest.rating}</span></div>
            <div style="margin-top:auto;"><span style="font-size:1.45rem;font-weight:800;color:var(--accent);">HK$ ${rest.price}</span><span style="font-size:0.75rem;color:var(--text-muted);"> /位起</span></div>
            <button class="btn-select-menu ${isAI ? 'gold-btn' : ''}" style="margin-top:8px;" onclick="openMenuModal(${rest.id})">${isAI ? '預訂 AI 推薦套餐' : '查看套餐及席位'}</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function setupAiModals() {
    const aiRest = restaurantsData.find(r => r.id === AI_RECOMMENDED_ID) || restaurantsData[0];
    if (!aiRest) return;

    document.getElementById("modalAiRecTitle").innerText = aiRest.name;
    document.getElementById("modalAiRecName").innerText = aiRest.name;
    document.getElementById("modalAiRecLoc").innerText = aiRest.location;
    document.getElementById("modalAiRecPrice").innerText = `HK$ ${aiRest.price}`;
    document.getElementById("modalAiRecImg").src = aiRest.images[0];
    document.getElementById("modalAiRecNudgeText").innerText = AI_NUDGE_TEXT;

    document.getElementById("floatingTitle").innerText = aiRest.name;
    document.getElementById("floatingPrice").innerText = `HK$ ${aiRest.price} /位起`;
    document.getElementById("floatingThumb").src = aiRest.images[0];

    setTimeout(() => {
      document.getElementById("entryRecommendModal").classList.add("active");
      document.getElementById("floatingRecommendPopup").classList.add("active");
    }, 400);
  }

  function acceptRecommendation() {
    dismissRecommendation();
    closeFloatingPopup();
    openMenuModal(AI_RECOMMENDED_ID);
  }
  function dismissRecommendation() { document.getElementById("entryRecommendModal").classList.remove("active"); }
  function closeFloatingPopup() { document.getElementById("floatingRecommendPopup").classList.remove("active"); }

  function openMenuModal(id) {
    selectedRest = restaurantsData.find(r => r.id === id);
    document.getElementById("modalRestTitle").innerText = selectedRest.name;
    document.getElementById("modalRestSubtitle").innerText = selectedRest.location;

    document.getElementById("modalMenuList").innerHTML = selectedRest.menus.map(m => `
      <div style="border:1px solid #e2e8f0;border-radius:8px;display:flex;overflow:hidden;">
        <img src="${m.image}" style="width:180px;object-fit:cover;">
        <div style="padding:1rem;flex:1;display:flex;flex-direction:column;justify-content:space-between;">
          <div><h4 style="font-weight:700;">${m.name}</h4><p style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">${m.style} • ${m.seating} • ${m.drinks}</p></div>
          <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;">
            <span style="font-size:1.25rem;font-weight:800;color:var(--accent);">HK$ ${m.price}</span>
            <button class="btn-search" style="padding:0.4rem 0.8rem;font-size:0.85rem;" onclick="openCheckoutModal('${m.id}')">預訂此套餐</button>
          </div>
        </div>
      </div>
    `).join('');
    document.getElementById("menuModal").classList.add("active");
  }
  function closeMenuModal() { document.getElementById("menuModal").classList.remove("active"); }

  function openCheckoutModal(menuId) {
    selectedMenu = selectedRest.menus.find(m => m.id === menuId);
    closeMenuModal();
    document.getElementById("checkoutRestName").innerText = selectedRest.name;
    document.getElementById("checkoutMenuName").innerText = selectedMenu.name;
    const total = selectedMenu.price * 2;
    document.getElementById("checkoutTotalPrice").innerText = `HK$ ${(total * 1.1).toFixed(0)}`;
    document.getElementById("checkoutModal").classList.add("active");
  }
  function closeCheckoutModal() { document.getElementById("checkoutModal").classList.remove("active"); }

  async function confirmBooking() {
    const isAiChosen = (selectedRest.id === AI_RECOMMENDED_ID);
    const bookingRef = "BK-" + Math.floor(100000 + Math.random() * 900000);

    const record = {
      bookingRef: bookingRef,
      participantID: currentPID,
      aiRecommendedRestaurantId: AI_RECOMMENDED_ID,
      selectedRestaurantId: selectedRest.id,
      selectedRestaurantName: selectedRest.name,
      isAiRecommendedSelected: isAiChosen,
      menuName: selectedMenu.name,
      totalAmount: document.getElementById("checkoutTotalPrice").innerText,
      bookingTime: new Date().toLocaleString()
    };

    try {
      if (typeof db !== 'undefined') {
        await db.ref('restaurant_bookings').push(record);
      }
    } catch (e) {
      console.error(e);
    }

    alert(`預訂成功！已為您確認 ${selectedRest.name} 之席位。即將進入後續問卷調查。`);
    window.location.href = "post_survey.html";
  }

  function updatePriceFilter(val) {
    document.getElementById("priceRangeLabel").innerText = `最高 HK$ ${parseInt(val).toLocaleString()}`;
    filterRestaurants();
  }

  function filterRestaurants() {
    const max = parseInt(document.getElementById("priceRange").value);
    const starCbs = Array.from(document.querySelectorAll('input[name="star"]:checked')).map(c => parseInt(c.value));
    const pRoom = document.getElementById("filterPrivateRoom").checked;
    const wSeat = document.getElementById("filterWindowSeat").checked;
    const park = document.getElementById("filterParking").checked;

    currentRestaurants = restaurantsData.filter(r => {
      if (r.price > max) return false;
      if (starCbs.length && !starCbs.includes(r.stars)) return false;
      if (pRoom && !r.hasPrivateRoom) return false;
      if (wSeat && !r.hasWindowSeat) return false;
      if (park && !r.hasParking) return false;
      return true;
    });
    renderRestaurantList(currentRestaurants);
  }

  function resetFilters() {
    document.getElementById("priceRange").value = 5000;
    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    currentRestaurants = [...restaurantsData];
    renderRestaurantList(currentRestaurants);
  }

  function sortRestaurants(type, btn) {
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    if (type === 'priceAsc') currentRestaurants.sort((a,b) => a.price - b.price);
    else if (type === 'rating') currentRestaurants.sort((a,b) => b.rating - a.rating);
    else currentRestaurants.sort((a,b) => (a.id === AI_RECOMMENDED_ID ? -1 : b.id === AI_RECOMMENDED_ID ? 1 : 0));
    renderRestaurantList(currentRestaurants);
  }

  window.addEventListener("DOMContentLoaded", () => {
    updateFilterCounts();
    renderRestaurantList(restaurantsData);
    setupAiModals();
  });
</script>
</body>
</html>
