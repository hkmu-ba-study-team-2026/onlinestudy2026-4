<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Research Survey 1</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #606f7b;
            --accent-color: #e11d48;
            --hover-color: #be123c;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-primary); line-height: 1.6; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { background-color: var(--card-bg); max-width: 800px; width: 100%; height: calc(100vh - 40px); border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); padding: 30px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .fixed-top-section { flex-shrink: 0; border-bottom: 2px solid var(--bg-color); margin-bottom: 15px; padding-bottom: 15px; }
        .academic-badge { display: inline-block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; color: #718096; background-color: #edf2f7; padding: 4px 10px; border-radius: 4px; margin-bottom: 8px; }
        h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
        p.intro { font-size: 0.88rem; color: var(--text-secondary); }
        .scale-info { background-color: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-size: 0.85rem; }
        .scale-info h3 { font-size: 0.9rem; margin-bottom: 6px; }
        .scale-info ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 4px 10px; list-style: none; color: var(--text-secondary); }
        .dev-autofill-btn { display: inline-block; margin-top: 12px; padding: 6px 14px; background-color: #e2e8f0; color: #4a5568; border: 1px dashed #cbd5e1; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        #surveyForm { flex: 1; overflow-y: auto; padding-right: 12px; margin-top: 10px; }
        #surveyForm::-webkit-scrollbar { width: 6px; }
        #surveyForm::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .form-group { margin-bottom: 20px; }
        label.question-title { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .question-title .required { color: #e53e3e; margin-left: 4px; }
        .scale-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .scale-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
        .scale-card label { display: flex; align-items: center; justify-content: center; width: 100%; height: 40px; background-color: #fafafa; border: 1.5px solid var(--border-color); border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 700; color: var(--text-primary); transition: all 0.2s ease; }
        .scale-card input[type="radio"]:checked + label { border-color: var(--accent-color); background-color: #fff1f2; color: var(--accent-color); box-shadow: 0 0 0 1px var(--accent-color); }
        .submit-btn { display: block; width: 100%; padding: 14px; background-color: var(--accent-color); color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin: 30px 0 10px 0; }
        .submit-btn:hover { background-color: var(--hover-color); }
        .scale-hint { font-size: 0.68rem; font-weight: 500; color: var(--text-secondary); margin-top: 5px; text-align: center; line-height: 1.2; width: 100%; display: block; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5OysrS98cHA7WXbObSGtUvfazPJStkRE",
            authDomain: "online-study-4.firebaseapp.com",
            databaseURL: "https://online-study-4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "online-study-4",
            storageBucket: "online-study-4.firebasestorage.app",
            messagingSenderId: "597103940431",
            appId: "1:597103940431:web:d854df1b51a7f76f2aeb3a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
    <!-- 引入餐廳數據集 -->
    <script src="restaurants_data.js"></script>
</head>
<body>

<div class="container">
    <div class="fixed-top-section">
        <header>
            <div class="academic-badge">Dining Preference Survey 1</div>
            <h1>Restaurant Preference Investigation</h1>
            <p class="intro">All data collected will be kept completely anonymous and strictly used for academic research purposes.</p>
        </header>

        <div class="scale-info">
            <h3>Response Scale Reference:</h3>
            <ul>
                <li><strong>1</strong> = Not at all important</li>
                <li><strong>4</strong> = Neutral</li>
                <li><strong>7</strong> = Extremely important</li>
            </ul>
        </div>
        <button type="button" class="dev-autofill-btn" onclick="autoFillRandom()">⚡ Quick Autofill (Random)</button>
    </div>

    <form id="surveyForm" onsubmit="handleSubmit(event)">
        <div class="form-group" style="background: #eef2f7; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
            <label class="question-title">Participant ID <span class="required">*</span></label>
            <input type="text" id="inputParticipantID" name="inputParticipantID" required placeholder="Please enter your Participant ID" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.95rem; margin-top: 6px;">
        </div>

        <div class="form-group"><label class="question-title">1. Michelin / Fine Dining gastronomic experience. <span class="required">*</span></label><div class="scale-grid" id="q01_sensory_experience"></div></div>
        <div class="form-group"><label class="question-title">2. Seasonal fresh ingredients and culinary freshness. <span class="required">*</span></label><div class="scale-grid" id="q02_fresh"></div></div>
        <div class="form-group"><label class="question-title">3. Familiarity with cuisine style (Cantonese, French, Japanese, etc.). <span class="required">*</span></label><div class="scale-grid" id="q03_familiar"></div></div>
        <div class="form-group"><label class="question-title">4. High quality chef-crafted tasting menus. <span class="required">*</span></label><div class="scale-grid" id="q04_high_quality"></div></div>
        <div class="form-group"><label class="question-title">5. Availability of private dining rooms or panoramic view seating. <span class="required">*</span></label><div class="scale-grid" id="q05_healthy"></div></div>
        <div class="form-group"><label class="question-title">6. Hygiene standards & wine pairing excellence. <span class="required">*</span></label><div class="scale-grid" id="q06_safe_to_consume"></div></div>
        <div class="form-group"><label class="question-title">7. Price justified by ambiance and Michelin accolades. <span class="required">*</span></label><div class="scale-grid" id="q07_price_within_budget"></div></div>
        <div class="form-group"><label class="question-title">8. Sustainable sourcing & green gastronomic practices. <span class="required">*</span></label><div class="scale-grid" id="q08_price_justified"></div></div>

        <button type="submit" id="submitBtn" class="submit-btn">Submit</button>
    </form>
</div>

<script>
    const questionIds = [
        "q01_sensory_experience", "q02_fresh", "q03_familiar", "q04_high_quality",
        "q05_healthy", "q06_safe_to_consume", "q07_price_within_budget", "q08_price_justified"
    ];

    questionIds.forEach(qId => {
        const container = document.getElementById(qId);
        if (!container) return;
        for (let i = 1; i <= 7; i++) {
            const card = document.createElement("div");
            card.className = "scale-card";
            let hintText = "";
            if (i === 1) hintText = '<span class="scale-hint">Not important</span>';
            if (i === 4) hintText = '<span class="scale-hint">Neutral</span>';
            if (i === 7) hintText = '<span class="scale-hint">Important</span>';
            card.innerHTML = `
                <input type="radio" id="${qId}_${i}" name="${qId}" value="${i}" required>
                <label for="${qId}_${i}">${i}</label>
                ${hintText}
            `;
            container.appendChild(card);
        }
    });

    function autoFillRandom() {
        if (!document.getElementById("inputParticipantID").value) {
            document.getElementById("inputParticipantID").value = "P" + Math.floor(1000 + Math.random() * 9000);
        }
        questionIds.forEach(qId => {
            const randomVal = Math.floor(Math.random() * 7) + 1;
            const radio = document.getElementById(`${qId}_${randomVal}`);
            if (radio) radio.checked = true;
        });
    }

    async function handleSubmit(event) {
        event.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        const participantNum = document.getElementById('inputParticipantID').value.trim();
        localStorage.setItem("participantID", participantNum);

        const formData = new FormData(event.target);
        const surveyResponses = {};
        questionIds.forEach(qId => {
            surveyResponses[qId] = parseInt(formData.get(qId), 10);
        });

        // 預設 AI 推薦目標 (預設為 ID 42 Caprice 或依偏好自適應)
        let recommendedRestaurantId = 42;
        let nudgeText = "Caprice (香港四季酒店) 擁有頂級景觀與精緻餐酒搭配。";

        const payload = {
            restaurants: typeof restaurantsData !== 'undefined' ? restaurantsData : [],
            preferences: surveyResponses
        };

        try {
            const response = await fetch("/api/recommend", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const resData = await response.json();
                if (resData.recommendedRestaurantId) recommendedRestaurantId = resData.recommendedRestaurantId;
                if (resData.recommendation) nudgeText = resData.recommendation;
            }
        } catch (error) {
            console.warn("Using default AI recommendation logic:", error);
            // 本地啟發式規則 Fallback: 若第5題偏好極高且喜愛日式，推薦 15 鮨·志魂，否則 42 Caprice
            if (surveyResponses["q05_healthy"] >= 6 && surveyResponses["q03_familiar"] <= 3) {
                recommendedRestaurantId = 15; // 鮨·志魂
                nudgeText = "鮨·志魂 (Sushi Shikon) 能提供專屬優質日式料理。";
            }
        }

        // 本地保存 AI 推薦資訊
        localStorage.setItem('ai_recommended_restaurant_id', recommendedRestaurantId);
        localStorage.setItem('ai_nudge_text', nudgeText);
        localStorage.setItem('user_preferences', JSON.stringify(surveyResponses));

        // 寫入 Firebase
        const firebaseData = {
            participantID: participantNum,
            submittedAt: new Date().toLocaleString(),
            aiRecommendedRestaurantId: recommendedRestaurantId,
            nudgeContent: nudgeText,
            responses: surveyResponses
        };

        try {
            await db.ref('survey_responses').push(firebaseData);
        } catch (dbError) {
            console.error('Failed to save to Firebase:', dbError);
        }

        setTimeout(() => {
            window.location.href = 'restaurant_page.html';
        }, 500);
    }
</script>
</body>
</html>
