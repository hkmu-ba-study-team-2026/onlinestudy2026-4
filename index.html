<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问卷调查</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #606f7b;
            --accent-color: #e11d48;
            --hover-color: #be123c;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 36px 30px;
            border: 1px solid var(--border-color);
        }
        .lead-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg-color);
        }
        .form-group {
            margin-bottom: 24px;
        }
        label.question-title {
            display: block;
            font-size: 0.98rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .required {
            color: #e53e3e;
            margin-left: 4px;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .radio-card {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fafafa;
        }
        .radio-card:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }
        .radio-card input[type="radio"] {
            accent-color: var(--accent-color);
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
        }
        .radio-card span {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            background-color: #fafafa;
            outline: none;
            cursor: pointer;
        }
        .form-select:focus {
            border-color: var(--accent-color);
            background-color: #ffffff;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: var(--hover-color);
        }
        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5OysrS98cHA7WXbObSGtUvfazPJStkRE",
            authDomain: "online-study-4.firebaseapp.com",
            databaseURL: "https://online-study-4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "online-study-4",
            storageBucket: "online-study-4.firebasestorage.app",
            messagingSenderId: "597103940431",
            appId: "1:597103940431:web:d854df1b51a7f76f2aeb3a"
        };
        try {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.database();
        } catch(e) {
            console.warn("Firebase 初始化略過或已存在:", e);
        }
    </script>
    <script src="restaurants_data.js"></script>
</head>
<body>

<div class="container">
    <p class="lead-text">请继续填写以下部分</p>

    <form id="surveyForm" onsubmit="handleSubmit(event)">
        <!-- 问题 1 -->
        <div class="form-group">
            <label class="question-title">1. 你选择餐厅时注重什么？<span class="required">*</span></label>
            <div class="radio-group">
                <label class="radio-card">
                    <input type="radio" name="focus_factor" value="价钱便宜" required>
                    <span>价钱便宜</span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="focus_factor" value="食物质素" required>
                    <span>食物质素</span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="focus_factor" value="环境舒适" required>
                    <span>环境舒适</span>
                </label>
            </div>
        </div>

        <!-- 问题 2 -->
        <div class="form-group">
            <label class="question-title">2. 你想在哪一区用餐？<span class="required">*</span></label>
            <select name="preferred_district" id="preferred_district" class="form-select" required>
                <option value="" disabled selected>请选择地区（香港18区）</option>
                <optgroup label="香港岛">
                    <option value="中西区">中西区</option>
                    <option value="湾仔区">湾仔区</option>
                    <option value="东区">东区</option>
                    <option value="南区">南区</option>
                </optgroup>
                <optgroup label="九龙">
                    <option value="油尖旺区">油尖旺区</option>
                    <option value="深水埗区">深水埗区</option>
                    <option value="九龙城区">九龙城区</option>
                    <option value="黄大仙区">黄大仙区</option>
                    <option value="观塘区">观塘区</option>
                </optgroup>
                <optgroup label="新界">
                    <option value="葵青区">葵青区</option>
                    <option value="荃湾区">荃湾区</option>
                    <option value="屯门区">屯门区</option>
                    <option value="元朗区">元朗区</option>
                    <option value="北区">北区</option>
                    <option value="大埔区">大埔区</option>
                    <option value="沙田区">沙田区</option>
                    <option value="西贡区">西贡区</option>
                    <option value="离岛区">离岛区</option>
                </optgroup>
            </select>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">提交</button>
    </form>
</div>

<script>
    let currentPID = "";

    function generate32DigitParticipantID() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const timestampPart = `${year}${month}${day}${hours}${minutes}${seconds}`;

        let randomDigits = '';
        while (randomDigits.length < 18) {
            randomDigits += Math.floor(Math.random() * 10).toString();
        }
        return timestampPart + randomDigits;
    }

    async function initUserSession() {
        let participantID = localStorage.getItem("participantID");
        if (!participantID || participantID.length !== 32) {
            participantID = generate32DigitParticipantID();
            localStorage.setItem("participantID", participantID);

            // 背景寫入，不 await 卡住頁面
            if (typeof db !== 'undefined') {
                db.ref('users/' + participantID).set({
                    participantID: participantID,
                    createdAt: new Date().toISOString(),
                    timestamp: Date.now()
                }).catch(err => console.warn("Firebase 註冊使用者略過:", err));
            }
        }
        currentPID = participantID;
    }

    async function handleSubmit(event) {
        event.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '提交中，正在跳轉...';

        const formData = new FormData(event.target);
        const focusFactor = formData.get("focus_factor");
        const preferredDistrict = formData.get("preferred_district");

        const surveyResponses = {
            focus_factor: focusFactor,
            preferred_district: preferredDistrict
        };

        // 1. 本地即時配對計算推薦餐廳
        const allRests = typeof restaurantsData !== 'undefined' ? restaurantsData : [];
        let matchingRests = allRests.filter(r => r.location === preferredDistrict);
        if (matchingRests.length === 0) matchingRests = [...allRests];

        if (focusFactor === "价钱便宜") {
            matchingRests.sort((a, b) => a.price - b.price);
        } else if (focusFactor === "食物质素") {
            matchingRests.sort((a, b) => b.rating - a.rating);
        } else {
            matchingRests.sort((a, b) => (b.hasWindowSeat ? 1 : 0) - (a.hasWindowSeat ? 1 : 0));
        }

        let recommendedRestaurantId = matchingRests[0] ? matchingRests[0].id : 1;
        let nudgeText = `根据您在「${preferredDistrict}」注重「${focusFactor}」的用餐偏好，为您精心甄选推荐：${matchingRests[0] ? matchingRests[0].name : ''}。`;

        // 2. 嘗試調用 AI API（加入 1.5 秒逾時保護，逾時自動改用本地配對）
        const controller = new AbortController();
        const fetchTimeout = setTimeout(() => controller.abort(), 1500);

        try {
            const simplifiedRestaurants = allRests.slice(0, 40).map(r => ({
                id: r.id,
                name: r.name,
                location: r.location,
                stars: r.stars,
                price: r.price
            }));

            const response = await fetch("/api/recommend", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    restaurants: simplifiedRestaurants,
                    preferences: surveyResponses
                }),
                signal: controller.signal
            });

            if (response.ok) {
                const resData = await response.json();
                if (resData.recommend_hotel_id) recommendedRestaurantId = resData.recommend_hotel_id;
                if (resData.nudge_text) nudgeText = resData.nudge_text;
            }
        } catch (error) {
            console.log("使用本地精準配對結果作為推薦:", error.message);
        } finally {
            clearTimeout(fetchTimeout);
        }

        // 3. 儲存推薦資訊至 LocalStorage
        localStorage.setItem('ai_recommended_restaurant_id', recommendedRestaurantId.toString());
        localStorage.setItem('ai_nudge_text', nudgeText);
        localStorage.setItem('user_preferences', JSON.stringify(surveyResponses));

        // 4. 背景非阻塞寫入 Firebase
        if (typeof db !== 'undefined') {
            db.ref('survey_responses').push({
                participantID: currentPID,
                submittedAt: new Date().toLocaleString(),
                aiRecommendedRestaurantId: recommendedRestaurantId,
                nudgeContent: nudgeText,
                responses: surveyResponses
            }).catch(e => console.warn("Firebase 紀錄略過:", e));
        }

        // 5. 立刻安全跳轉至預訂頁面
        window.location.href = 'restaurant_page.html';
    }

    window.addEventListener("DOMContentLoaded", initUserSession);
</script>
</body>
</html>
