    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #e11d48;
            --hover-color: #be123c;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            max-width: 820px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 36px 32px;
            border: 1px solid var(--border-color);
        }
        .lead-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg-color);
        }
        .form-group {
            margin-bottom: 24px;
            background: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 18px;
        }
        label.question-title {
            display: block;
            font-size: 0.96rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .required {
            color: #e11d48;
            margin-left: 4px;
        }
        .hint-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: normal;
            margin-left: 6px;
        }
        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }
        /* 7 點量表專用網格排版 */
        .likert-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        @media (max-width: 768px) {
            .likert-grid {
                grid-template-columns: 1fr;
            }
        }
        .option-card {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .option-card:hover {

            background: #f1f5f9;
        }
        .option-card input {
            accent-color: var(--accent-color);

            height: 16px;
            margin-right: 10px;
            cursor: pointer;
        }
        .likert-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px 4px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            background: #ffffff;
            transition: all 0.2s ease;

        .likert-card:hover {

            background: #f1f5f9;
        }
        .likert-card input {
            accent-color: var(--accent-color);

            height: 16px;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: var(--hover-color);
        }
        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;

<script>
    let currentPID = "";

    function generate32DigitParticipantID() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const timestampPart = `${year}${month}${day}${hours}${minutes}${seconds}`;

        let randomDigits = '';
        while (randomDigits.length < 18) {
            randomDigits += Math.floor(Math.random() * 10).toString();
        }
        return timestampPart + randomDigits;
    }

    async function initUserSession() {
        let participantID = localStorage.getItem("participantID");
        if (!participantID || participantID.length !== 32) {
            participantID = generate32DigitParticipantID();
            localStorage.setItem("participantID", participantID);

            if (typeof db !== 'undefined') {
                db.ref('users/' + participantID).set({
                    participantID: participantID,
                    createdAt: new Date().toISOString(),
                    timestamp: Date.now()
                }).catch(err => console.warn(err));
            }
        }
        currentPID = participantID;
    }

    // 原子递增 grouping 取得分组
    async function getAssignedGroup() {
        let assignedGroup = 0;
        let counterVal = 1;

        if (typeof db === 'undefined' || !db) {
            return { assignedGroup: Math.floor(Math.random() * 4), counterVal: 1 };
        }

        const groupRef = db.ref('grouping');

        try {
            const result = await groupRef.transaction((currentValue) => {
                if (currentValue === null || currentValue === undefined || isNaN(currentValue)) {
                    return 1;
                }
                return Number(currentValue) + 1;
            });

            if (result.committed && result.snapshot && result.snapshot.val() !== null) {
                counterVal = Number(result.snapshot.val());
                assignedGroup = (counterVal - 1) % 4;
            } else {
                throw new Error("Transaction 未能成功 commit");
            }
        } catch (err) {
            try {
                const snap = await groupRef.once('value');
                const rawVal = snap.val();
                const oldVal = (rawVal === null || isNaN(rawVal)) ? 0 : Number(rawVal);
                counterVal = oldVal + 1;
                await groupRef.set(counterVal);
                assignedGroup = (counterVal - 1) % 4;
            } catch (fallbackErr) {
                assignedGroup = Math.floor(Math.random() * 4);
                counterVal = 0;
            }
        }

        return { assignedGroup, counterVal };
    }

    // 自所有具有环保认证 (eco) 的餐厅中随机挑选一间
    function getRandomEcoRestaurant() {
        const allRests = (typeof restaurantsData !== 'undefined' && Array.isArray(restaurantsData)) ? restaurantsData : [];
        const ecoRests = allRests.filter(r => Boolean(r.ecoAward) || Boolean(r.hasSustainable));
        if (ecoRests.length === 0) {
            return allRests[0] || { id: 46, name: "Roganic Hong Kong" };
        }
        const randomIndex = Math.floor(Math.random() * ecoRests.length);
        return ecoRests[randomIndex];
    }

    async function handleSubmit(event) {
        event.preventDefault();

        const selectedFacilities = Array.from(document.querySelectorAll('input[name="facility_highlight"]:checked')).map(cb => cb.value);

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '提交中，正在为您挑选专属餐厅...';

        const formData = new FormData(event.target);
        const budgetTier = parseInt(formData.get("budget_tier"), 10);
        const preferredRegion = (formData.get("preferred_region") || "").trim();
        const preferredCuisine = (formData.get("preferred_cuisine") || "").trim();

        // 提取 7 级量表回答 (1~7)
        const q5Friendly = parseInt(formData.get("q5_friendly"), 10);
        const q6Polite = parseInt(formData.get("q6_polite"), 10);
        const q7AdmitMistakes = parseInt(formData.get("q7_admit_mistakes"), 10);

        const surveyResponses = {
            budget_tier: budgetTier,
            preferred_region: preferredRegion,
            preferred_cuisine: preferredCuisine,
            facility_highlights: selectedFacilities,
            q5_friendly: q5Friendly,
            q6_polite: q6Polite,
            q7_admit_mistakes: q7AdmitMistakes
        };

        const { assignedGroup, counterVal } = await getAssignedGroup();

        const useRealAi = (assignedGroup === 0 || assignedGroup === 2);
        const showAiLabel = (assignedGroup === 0 || assignedGroup === 1);

        const allRests = (typeof restaurantsData !== 'undefined' && Array.isArray(restaurantsData)) ? restaurantsData : [];

        let finalRecId = 46;
        let finalNudgeText = "";

        if (useRealAi) {
            // === 真实 AI 组 (Group 0 & 2)：正交最佳匹配 ===
            const ecoCandidates = allRests.filter(r => Boolean(r.ecoAward) || Boolean(r.hasSustainable));
            const pool = ecoCandidates.length > 0 ? ecoCandidates : allRests;

            let scoredRests = pool.map(r => {
                let score = 0;
                if (r.region === preferredRegion) score += 40;
                if (r.cuisine === preferredCuisine) score += 35;
                if (r.price <= budgetTier) score += 25;
                else score -= Math.min(30, Math.round((r.price - budgetTier) / 50));
                selectedFacilities.forEach(fKey => {
                    if (r[fKey]) score += 10;
                });
                return { rest: r, score: score };
            });

            scoredRests.sort((a, b) => b.score - a.score);
            const bestLocalMatch = scoredRests[0] ? scoredRests[0].rest : pool[0];

            if (bestLocalMatch) {
                finalRecId = bestLocalMatch.id;
                finalNudgeText = showAiLabel
                    ? `AI 智能分析\n根据您对「${preferredRegion}」及「${preferredCuisine}」的偏好，为您特别推荐荣获环保认证的 ${bestLocalMatch.name}。`
                    : `根据您对「${preferredRegion}」及「${preferredCuisine}」的偏好，为您特别推荐荣获环保认证的 ${bestLocalMatch.name}。`;
            }

            // 尝试呼叫后端 API
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);

            try {
                const response = await fetch("/api/recommend", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        restaurants: allRests.slice(0, 40),
                        preferences: surveyResponses
                    }),
                    signal: controller.signal
                });

                if (response.ok) {
                    const resData = await response.json();
                    if (resData.recommend_hotel_id) finalRecId = resData.recommend_hotel_id;
                    if (resData.nudge_text) {
                        let text = resData.nudge_text;
                        if (!showAiLabel) {
                            text = text.replace(/AI\s*智能(推荐|分析)?/gi, "专家精心")
                                .replace(/AI/gi, "精选");
                        }
                        finalNudgeText = text;
                    }
                }
            } catch (e) {
                console.log("使用本地正交精准匹配餐厅:", finalRecId);
            } finally {
                clearTimeout(timeout);
            }
        } else {
            // === 非 AI 推荐组 (Group 1 & 3)：自所有 Eco 餐厅中随机挑选 1 间 ===
            const randomEcoRest = getRandomEcoRestaurant();
            finalRecId = randomEcoRest.id;
            const ecoHighlight = randomEcoRest.ecoAward || "可持续环保与有机认证";

            finalNudgeText = showAiLabel
                ? `AI 智能分析\n为您精选荣获${ecoHighlight}的 ${randomEcoRest.name}，坚持品质食材与可持续美馔体验。`
                : `为您精选荣获${ecoHighlight}的 ${randomEcoRest.name}，坚持品质食材与可持续美馔体验。`;
        }

        // 保存状态至本地
        localStorage.setItem('participantGroup', assignedGroup.toString());
        localStorage.setItem('showAiLabel', showAiLabel ? "true" : "false");
        localStorage.setItem('ai_recommended_restaurant_id', finalRecId.toString());
        localStorage.setItem('ai_nudge_text', finalNudgeText);
        localStorage.setItem('user_preferences', JSON.stringify(surveyResponses));

        // 写入 Firebase
        if (typeof db !== 'undefined' && db) {
            try {
                await db.ref('survey_responses').push({
                    participantID: currentPID,
                    assignedGroup: assignedGroup,
                    groupCounter: counterVal,
                    useRealAi: useRealAi,
                    showAiLabel: showAiLabel,
                    submittedAt: new Date().toLocaleString(),
                    aiRecommendedRestaurantId: finalRecId,
                    nudgeContent: finalNudgeText,
                    responses: surveyResponses
                });
            } catch (writeErr) {
                console.warn("写入 survey_responses 发生异常:", writeErr);
            }
        }

        window.location.href = 'restaurant_page.html';
    }

    window.addEventListener("DOMContentLoaded", initUserSession);
</script>
