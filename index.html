<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用餐偏好问卷</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #e11d48;
            --hover-color: #be123c;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            max-width: 680px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 36px 32px;
            border: 1px solid var(--border-color);
        }
        .lead-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg-color);
        }
        .form-group {
            margin-bottom: 24px;
            background: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 18px;
        }
        label.question-title {
            display: block;
            font-size: 0.96rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .required {
            color: #e11d48;
            margin-left: 4px;
        }
        .hint-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: normal;
            margin-left: 6px;
        }
        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
        }
        .option-card {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .option-card:hover {
            border-color: #cbd5e1;
            background: #f1f5f9;
        }
        .option-card input {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            margin-right: 10px;
            cursor: pointer;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: var(--hover-color);
        }
        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5OysrS98cHA7WXbObSGtUvfazPJStkRE",
            authDomain: "online-study-4.firebaseapp.com",
            databaseURL: "https://online-study-4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "online-study-4",
            storageBucket: "online-study-4.firebasestorage.app",
            messagingSenderId: "597103940431",
            appId: "1:597103940431:web:d854df1b51a7f76f2aeb3a"
        };
        try {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.database();
        } catch(e) {}
    </script>
    <script src="restaurants_data.js"></script>
</head>
<body>

<div class="container">
    <p class="lead-text">请继续填写以下部分</p>

    <form id="surveyForm" onsubmit="handleSubmit(event)">

        <!-- 问题 1：对应 Panel 价格滑块 -->
        <div class="form-group">
            <label class="question-title">1. 这次就餐，你最契合哪种消费心境与用餐场景？<span class="required">*</span></label>
            <div class="radio-grid">
                <label class="option-card">
                    <input type="radio" name="budget_tier" value="简单便餐" required>
                    <span>简单便餐</span>
                </label>
                <label class="option-card">
                    <input type="radio" name="budget_tier" value="地道小馆" required>
                    <span>地道小馆</span>
                </label>
                <label class="option-card">
                    <input type="radio" name="budget_tier" value="精致体验" required>
                    <span>精致体验</span>
                </label>
                <label class="option-card">
                    <input type="radio" name="budget_tier" value="顶奢品鉴" required>
                    <span>顶奢品鉴</span>
                </label>
            </div>
        </div>

        <!-- 问题 2 (原问题 3)：对应 Panel 地区分布 -->
        <div class="form-group">
            <label class="question-title">2. 你希望在哪一个地区就餐？<span class="required">*</span></label>
            <div class="radio-grid">
                <label class="option-card">
                    <input type="radio" name="preferred_region" value="香港岛" required>
                    <span>香港岛</span>
                </label>
                <label class="option-card">
                    <input type="radio" name="preferred_region" value="九龙" required>
                    <span>九龙</span>
                </label>
                <label class="option-card">
                    <input type="radio" name="preferred_region" value="新界东" required>
                    <span>新界东</span>
                </label>
                <label class="option-card">
                    <input type="radio" name="preferred_region" value="新界西" required>
                    <span>新界西</span>
                </label>
            </div>
        </div>

        <!-- 问题 3 (原问题 4)：对应 Panel 菜系风味 -->
        <div class="form-group">
            <label class="question-title">3. 本次用餐你最期待体验的菜系风味是？<span class="required">*</span></label>
            <div class="radio-grid">
                <label class="option-card">
                    <input type="radio" name="preferred_cuisine" value="中式料理" required>
                    <span>中式料理</span>
                </label>
                <label class="option-card">
                    <input type="radio" name="preferred_cuisine" value="法式料理" required>
                    <span>法式料理</span>
                </label>
                <label class="option-card">
                    <input type="radio" name="preferred_cuisine" value="日本料理" required>
                    <span>日本料理</span>
                </label>
                <label class="option-card">
                    <input type="radio" name="preferred_cuisine" value="意式料理" required>
                    <span>意式料理</span>
                </label>
            </div>
        </div>

        <!-- 问题 4 (原问题 5)：多选题（特色设施与认证，可多选或全不选） -->
        <div class="form-group">
            <label class="question-title">
                4. 哪些专属设施或就餐礼遇符合你的需求？
                <span class="hint-text">(可多选，或全部不选)</span>
            </label>
            <div class="radio-grid">
                <label class="option-card">
                    <input type="checkbox" name="facility_highlight" value="独立私密包厢">
                    <span>独立私密包厢</span>
                </label>
                <label class="option-card">
                    <input type="checkbox" name="facility_highlight" value="浪漫靠窗席位">
                    <span>浪漫靠窗席位</span>
                </label>
                <label class="option-card">
                    <input type="checkbox" name="facility_highlight" value="代客泊车或便利车位">
                    <span>代客泊车或便利车位</span>
                </label>
                <label class="option-card">
                    <input type="checkbox" name="facility_highlight" value="餐酒搭配佐餐">
                    <span>餐酒搭配佐餐</span>
                </label>
                <label class="option-card">
                    <input type="checkbox" name="facility_highlight" value="有机食材认证">
                    <span>有机食材认证</span>
                </label>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">提交问卷并查看推荐</button>
    </form>
</div>

<script>
    let currentPID = "";

    // 默认固定推荐选项（米芝莲一星 + 绿星有机认证）
    const DEFAULT_ECO_STAR1_ID = 46; // Roganic Hong Kong
    const DEFAULT_NUDGE_AI = "AI 智能分析\n为您精选荣获米其林绿星的 Roganic Hong Kong，坚持新界本地有机农场直供与可持续微型菜园料理。";
    const DEFAULT_NUDGE_NORMAL = "为您精心甄选的主推餐厅 Roganic Hong Kong，坚持新界本地有机农场直供与可持续微型菜园料理。";

    function generate32DigitParticipantID() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const timestampPart = `${year}${month}${day}${hours}${minutes}${seconds}`;

        let randomDigits = '';
        while (randomDigits.length < 18) {
            randomDigits += Math.floor(Math.random() * 10).toString();
        }
        return timestampPart + randomDigits;
    }

    async function initUserSession() {
        let participantID = localStorage.getItem("participantID");
        if (!participantID || participantID.length !== 32) {
            participantID = generate32DigitParticipantID();
            localStorage.setItem("participantID", participantID);

            if (typeof db !== 'undefined') {
                db.ref('users/' + participantID).set({
                    participantID: participantID,
                    createdAt: new Date().toISOString(),
                    timestamp: Date.now()
                }).catch(err => console.warn(err));
            }
        }
        currentPID = participantID;
    }

    // 確保每次送出問卷都 100% 成功將 grouping + 1
    async function getAssignedGroup() {
        let assignedGroup = 0;
        let counterVal = 1;

        if (typeof db === 'undefined' || !db) {
            console.warn("Firebase 未初始化，使用隨機分組");
            return { assignedGroup: Math.floor(Math.random() * 4), counterVal: 1 };
        }

        const groupRef = db.ref('grouping');

        try {
            // 方式 1: 使用 transaction 原子累加 (推薦高並發環境)
            const result = await groupRef.transaction((currentValue) => {
                // 如果目前是 null 或未定義，從 1 開始；否則每次 + 1
                if (currentValue === null || currentValue === undefined || isNaN(currentValue)) {
                    return 1;
                }
                return Number(currentValue) + 1;
            });

            if (result.committed && result.snapshot && result.snapshot.val() !== null) {
                counterVal = Number(result.snapshot.val());
                // counterVal 為累加後的新值 (例如 1, 2, 3, 4...)
                // (counterVal - 1) % 4 映射為 Group 0, 1, 2, 3
                assignedGroup = (counterVal - 1) % 4;
                console.log(`[Grouping 成功 +1]: 目前計數值 = ${counterVal}, 分配組別 = Group ${assignedGroup}`);
            } else {
                throw new Error("Transaction 未能成功 commit，嘗試備用方案");
            }
        } catch (err) {
            console.warn("Transaction 失敗，啟動備用直接寫入方案:", err);
            try {
                // 方式 2: 備用保底直接 read & set 確保數值一定會 +1
                const snap = await groupRef.once('value');
                const rawVal = snap.val();
                const oldVal = (rawVal === null || isNaN(rawVal)) ? 0 : Number(rawVal);
                counterVal = oldVal + 1;
                await groupRef.set(counterVal);
                assignedGroup = (counterVal - 1) % 4;
                console.log(`[備用寫入成功 Grouping +1]: 計數值 = ${counterVal}, 組別 = Group ${assignedGroup}`);
            } catch (fallbackErr) {
                console.error("備用方案亦失敗，使用本機隨機分組:", fallbackErr);
                assignedGroup = Math.floor(Math.random() * 4);
                counterVal = 0;
            }
        }

        return { assignedGroup, counterVal };
    }

    async function handleSubmit(event) {
        event.preventDefault();

        // 收集多選項，允許全不選 (空數組)
        const selectedFacilities = Array.from(document.querySelectorAll('input[name="facility_highlight"]:checked')).map(cb => cb.value);

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '提交中，正在为您挑选专属餐厅...';

        const formData = new FormData(event.target);
        const budgetTier = parseInt(formData.get("budget_tier"), 10);
        const preferredRegion = (formData.get("preferred_region") || "").trim();
        const preferredCuisine = (formData.get("preferred_cuisine") || "").trim();

        const surveyResponses = {
            budget_tier: budgetTier,
            preferred_region: preferredRegion,
            preferred_cuisine: preferredCuisine,
            facility_highlights: selectedFacilities
        };

        // 1. 取得分組
        const { assignedGroup, counterVal } = await getAssignedGroup();

        // Group 0: 真實 AI, 標示 AI
        // Group 1: 預設選項, 標示 AI (欺騙)
        // Group 2: 真實 AI, 不標示 AI
        // Group 3: 預設選項, 不標示 AI
        const useRealAi = (assignedGroup === 0 || assignedGroup === 2);
        const showAiLabel = (assignedGroup === 0 || assignedGroup === 1);

        let finalRecId = DEFAULT_ECO_STAR1_ID;
        let finalNudgeText = showAiLabel ? DEFAULT_NUDGE_AI : DEFAULT_NUDGE_NORMAL;

        // 2. 若屬於真實 AI / 動態推薦組
        if (useRealAi) {
            const allRests = (typeof restaurantsData !== 'undefined' && Array.isArray(restaurantsData)) ? restaurantsData : [];

            // ---【核心修正：正交本地精準匹配演算法 (強制篩選具備 ecoAward 餐廳)】---
            const ecoCandidates = allRests.filter(r => Boolean(r.ecoAward));
            const pool = ecoCandidates.length > 0 ? ecoCandidates : allRests;

            let scoredRests = pool.map(r => {
                let score = 0;
                // 優先比對地區 (40分)
                if (r.region === preferredRegion) score += 40;
                // 次優先比對菜系 (35分)
                if (r.cuisine === preferredCuisine) score += 35;
                // 預算貼合度 (25分)
                if (r.price <= budgetTier) score += 25;
                else score -= Math.min(30, Math.round((r.price - budgetTier) / 50));
                // 多選設施加分
                selectedFacilities.forEach(fKey => {
                    if (r[fKey]) score += 10;
                });
                return { rest: r, score: score };
            });

            scoredRests.sort((a, b) => b.score - a.score);
            const bestLocalMatch = scoredRests[0] ? scoredRests[0].rest : null;

            if (bestLocalMatch) {
                finalRecId = bestLocalMatch.id;
                finalNudgeText = showAiLabel
                    ? `AI 智能分析\n根据您对「${preferredRegion}」及「${preferredCuisine}」的偏好，为您特别推荐荣获环保认证的 ${bestLocalMatch.name}。`
                    : `根据您对「${preferredRegion}」及「${preferredCuisine}」的偏好，为您特别推荐荣获环保认证的 ${bestLocalMatch.name}。`;
            }

            // ---【嘗試調用後端 Gemini API，給予 5 秒充足緩衝時間】---
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000); // 延長至 5 秒

            try {
                const response = await fetch("/api/recommend", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        restaurants: allRests.slice(0, 40),
                        preferences: surveyResponses
                    }),
                    signal: controller.signal
                });

                if (response.ok) {
                    const resData = await response.json();
                    if (resData.recommend_hotel_id) finalRecId = resData.recommend_hotel_id;
                    if (resData.nudge_text) {
                        let text = resData.nudge_text;
                        if (!showAiLabel) {
                            text = text.replace(/AI\s*智能(推荐|分析)?/gi, "专家精心")
                                .replace(/AI/gi, "精选");
                        }
                        finalNudgeText = text;
                    }
                }
            } catch (e) {
                console.log("使用本地正交精準匹配餐廳:", finalRecId);
            } finally {
                clearTimeout(timeout);
            }
        }

        // 3. 儲存狀態至本地
        localStorage.setItem('participantGroup', assignedGroup.toString());
        localStorage.setItem('showAiLabel', showAiLabel ? "true" : "false");
        localStorage.setItem('ai_recommended_restaurant_id', finalRecId.toString());
        localStorage.setItem('ai_nudge_text', finalNudgeText);
        localStorage.setItem('user_preferences', JSON.stringify(surveyResponses));

        // 4. 非阻塞寫入 Firebase
        if (typeof db !== 'undefined' && db) {
            try {
                await db.ref('survey_responses').push({
                    participantID: currentPID,
                    assignedGroup: assignedGroup,
                    groupCounter: counterVal,
                    useRealAi: useRealAi,
                    showAiLabel: showAiLabel,
                    submittedAt: new Date().toLocaleString(),
                    aiRecommendedRestaurantId: finalRecId,
                    nudgeContent: finalNudgeText,
                    responses: surveyResponses
                });
            } catch (writeErr) {
                console.warn("写入 survey_responses 发生异常:", writeErr);
            }
        }

        window.location.href = 'restaurant_page.html';
    }

    window.addEventListener("DOMContentLoaded", initUserSession);
</script>
</body>
